title: "Begench Garahanov"
description: "Personal website of Begench Garahanov — researcher, engineer, and writer based in Tokyo, Japan."
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "contrast"
locale: "ja"
timezone: Asia/Tokyo
url: "https://garahanov.com"
baseurl: ""

# ── Plugins ──────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-paginate
  - jekyll-archives

# ── Markdown / Highlighter ───────────────────────────────
markdown: kramdown
highlighter: rouge

# ── Permalink ────────────────────────────────────────────
permalink: /:categories/:title/

# ── Date format & reading time ───────────────────────────
date_format: "%Y-%m-%d"
words_per_minute: 200

# ── Features ─────────────────────────────────────────────
enable_copy_code_button: true
breadcrumbs: true
search: true
search_provider: lunr
lunr:
  search_within_pages: true

# ── Author / Profile ─────────────────────────────────────
author:
  name: "Begench Garahanov"
  avatar: "/assets/images/Garahanov.jpeg"
  bio: "Master's candidate at Waseda University. Applied Chemistry engineer turned policy scientist. Technical Expert at Apple Japan. Bridging engineering, econometrics, and global leadership."
  location: "Tokyo, Japan"
  email: "garahanov@fuji.waseda.jp"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/garahan"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/bega_garahan"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bgarahanov"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:garahanov@fuji.waseda.jp"

# ── Site logo & teaser ───────────────────────────────────
logo: "/assets/images/Garahanov.jpeg"
header:
  teaser: /assets/images/Garahanov.jpeg
og_image: /assets/images/Garahanov.jpeg

# ── Social / SEO ─────────────────────────────────────────
twitter:
  username: "bega_garahan"

social:
  type: "Person"
  name: "Begench Garahanov"
  links:
    - "https://twitter.com/bega_garahan"
    - "https://github.com/garahan"
    - "https://www.linkedin.com/in/bgarahanov"

# ── Footer links ─────────────────────────────────────────
footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/bega_garahan"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/garahan"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bgarahanov"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:garahanov@fuji.waseda.jp"

# ── Comments (disabled until ready) ──────────────────────
comments:
  provider: false

# ── Analytics (disabled until ready) ─────────────────────
analytics:
  provider: false

# ── Atom feed ────────────────────────────────────────────
atom_feed:
  hide: false

# ── Defaults ─────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
      author: begench
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author: begench

# ── Archives ─────────────────────────────────────────────
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-taxonomy
    tag: archive-taxonomy
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

category_archive:
  type: jekyll-archives
  path: /categories/
tag_archive:
  type: jekyll-archives
  path: /tags/

# ── Pagination ───────────────────────────────────────────
paginate: 5
paginate_path: /page:num/

# ── HTML compression ─────────────────────────────────────
compress_html:
  clippings: all
  ignore:
    envs: development

# ── Include pages in collections ─────────────────────────
include:
  - _pages

# ── Exclusions ───────────────────────────────────────────
exclude:
  - "*.gemspec"
  - "*.gem"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
