---
layout: default
---

<article class="archive">
  <header class="archive-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="archive-content">
    <ul>
      {% for post in page.posts %}
        <li>
          <a href="{{ post.url }}">{{ post.title }}</a>
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
        </li>
      {% endfor %}
    </ul>
  </div>
</article>
